name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not -latest: Ubuntu 26.04 runners have no Python 3.9.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: detection contract --json

  integration:
    # Every real engine runs here: ffmpeg + Tesseract (jpn, jpn_vert, eng) + a Japanese font from apt, OpenCV and
    # ONNX Runtime from pip, the YuNet and YOLOX-Nano model files fetched by this job (pinned by sha256; the skill
    # itself never downloads anything), and read-only checkouts of ffmpeg-skill (frames) and Velisa (the OS)
    # (registry conformance). No test may skip. ffmpeg-skill runs at both ends of the supported range
    # (>=2.0.0 <4.0.0, ADR-002): the last 2.x tag and v3.0.0, on Ubuntu 24.04's FFmpeg 6.1 and Python 3.12.
    name: integration (ffmpeg-skill ${{ matrix.ffmpeg_skill }})
    strategy:
      fail-fast: false
      matrix:
        ffmpeg_skill: [v2.24.1, v3.0.0]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kajisho5/ffmpeg-skill
          ref: ${{ matrix.ffmpeg_skill }}
          path: ffmpeg-skill
      - uses: actions/checkout@v4
        with:
          repository: kajisho5/Velisa
          path: AI-video-production-OS
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-jpn tesseract-ocr-jpn-vert fonts-noto-cjk
      - run: pip install -e '.[all]' pillow
      - name: Model files for the real-engine tests (CI only, pinned by sha256)
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          cd "$RUNNER_TEMP/models"
          curl -fsSL -o face_detection_yunet_2026may.onnx \
            https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2026may.onnx
          curl -fsSL -o yolox_nano.onnx \
            https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.onnx
          printf '%s  %s\n' \
            ebafce4e3c118d6554634be5c27ab333b4c047a9a8c3faf1d7cf93101c22f0f0 face_detection_yunet_2026may.onnx \
            c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d yolox_nano.onnx | sha256sum -c -
      - name: Integration tests run (no test may skip)
        env:
          FFMPEG_SKILL_DIR: ${{ github.workspace }}/ffmpeg-skill
          AI_VIDEO_PRODUCTION_OS_DIR: ${{ github.workspace }}/AI-video-production-OS
          DETECTION_MODELS_DIR: ${{ runner.temp }}/models
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test.log
          if grep '\.\.\. skipped' test.log; then echo "real-engine tests were skipped"; exit 1; fi
      - name: doctor (all engines ready)
        env:
          DETECTION_MODELS_DIR: ${{ runner.temp }}/models
          DETECTION_FFMPEG_SKILL_DIR: ${{ github.workspace }}/ffmpeg-skill
        run: detection doctor --json
