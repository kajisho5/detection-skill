[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-skill"
version = "0.2.3"
description = "Faces, text (OCR, ja/en) and objects as measured boxes in time, shot boundaries and reframing paths, from frames ffmpeg-skill extracts: YuNet, Tesseract, YOLOX, PySceneDetect (PP-OCRv6 and RF-DETR optional); local, offline, CPU."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "kajisho5"}]
keywords = ["face-detection", "ocr", "object-detection", "yunet", "tesseract", "yolox", "pp-ocrv6", "rf-detr", "redaction", "shot-boundary-detection", "reframing", "offline", "agent-skill", "video-production"]
dependencies = []

[project.optional-dependencies]
# Each engine is optional (ADR-001). Floors clear every published advisory (ADR-002). Model files are never downloaded by the skill: see README.
faces = ["opencv-python-headless>=4.8.1.78", "numpy>=1.22"]
# OCR needs no Python package: it runs the `tesseract` binary (apt/brew/choco) with jpn, jpn_vert and eng traineddata.
text = []
# The optional PP-OCRv6 (text) and RF-DETR (objects) engines run on this extra too (ADR-008); no package of their own.
objects = ["onnxruntime>=1.16", "opencv-python-headless>=4.8.1.78", "numpy>=1.22"]
# Shots (ADR-003): PySceneDetect's detectors on frames ffmpeg-skill decodes. 0.7 requires opencv-python (not -headless)
# and Python 3.10, so the range stays on 0.6.x. TransNetV2 (optional) runs through the objects extra's onnxruntime.
shots = ["scenedetect>=0.6.7,<0.7", "opencv-python-headless>=4.8.1.78", "numpy>=1.22"]
all = ["opencv-python-headless>=4.8.1.78", "onnxruntime>=1.16", "numpy>=1.22", "scenedetect>=0.6.7,<0.7"]

[project.scripts]
detection = "detection_skill.cli:main"

[project.urls]
Repository = "https://github.com/kajisho5/detection-skill"

[tool.setuptools.packages.find]
where = ["src"]
